[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bootwarden"
version = "0.1.1"
description = "Audit UEFI firmware dumps for missing Secure Boot keys, unsigned modules, S3 boot-script vulns, and known SMM threats."
authors = [{name = "Cognis Digital", email = "suite@cognis.digital"}]
license = {text = "LicenseRef-COCL-1.0"}
requires-python = ">=3.10"
readme = "README.md"
keywords = ["cognis-digital", "cognis-neural-suite", "iot", "bootwarden"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
connect = ["cognis-connect @ git+https://github.com/cognis-digital/cognis-connect.git"]
mcp = ["mcp>=1.0"]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://cognis.digital"
Repository = "https://github.com/cognis-digital/bootwarden"

[project.scripts]
"bootwarden-emit" = "bootwarden.connect:emit_main"
bootwarden = "bootwarden.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["bootwarden"]
# Ship the bundled data-feed catalog alongside datafeeds.py so the feeds
# command works from an installed wheel (datafeeds loads it from its own dir).
artifacts = ["bootwarden/data_feeds_2026.json"]

[tool.hatch.build.targets.wheel.force-include]
"bootwarden/data_feeds_2026.json" = "bootwarden/data_feeds_2026.json"

[tool.hatch.metadata]
allow-direct-references = true
