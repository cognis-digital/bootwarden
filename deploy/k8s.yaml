apiVersion: apps/v1
kind: Deployment
metadata: { name: bootwarden, labels: { app: bootwarden } }
spec:
  replicas: 1
  selector: { matchLabels: { app: bootwarden } }
  template:
    metadata: { labels: { app: bootwarden } }
    spec:
      containers:
        - name: bootwarden
          image: ghcr.io/cognis-digital/bootwarden:latest
          ports: [{ containerPort: 8000 }]
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata: { name: bootwarden }
spec:
  selector: { app: bootwarden }
  ports: [{ port: 80, targetPort: 8000 }]
